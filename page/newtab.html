<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Axiom New Tab</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:#09090f;color:#eee;font-family:Arial,sans-serif;
  display:flex;justify-content:center;align-items:center;
  text-align:center;overflow:hidden
}
.main{width:min(700px,90%);margin-top:-50px}
.clock{font-size:48px;font-weight:600;margin:0 0 8px}
.subtitle{color:#888;margin:0 0 25px}
.search{
  display:flex;gap:8px;padding:8px;
  background:#11111a;border:1px solid #292939;border-radius:14px
}
input{
  flex:1;min-width:0;border:0;outline:0;
  background:transparent;color:#fff;padding:10px;font-size:16px
}
select,button{
  border:0;border-radius:8px;background:#1d1d2a;color:#ddd;
  padding:0 12px;cursor:pointer
}
button:hover,select:hover{background:#29293b;color:#fff}
.links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.link{height:42px;padding:0 15px}
.quote{margin-top:25px;color:#888;font-size:14px}
.footer{position:fixed;bottom:15px;color:#666;font-size:13px}
.heart{color:#e63946}
</style>
</head>
<body>
<main class="main">
  <h1 id="clock" class="clock">00:00:00</h1>
  <p class="subtitle">Axiom — simple browser, simple interface.</p>

  <form id="searchForm" class="search">
    <input id="searchInput" placeholder="Search the web..." autocomplete="off" autofocus>
    <select id="engine">
      <option value="https://www.google.com/search?q=">Google</option>
      <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
      <option value="https://www.bing.com/search?q=">Bing</option>
    </select>
    <button type="submit">Search</button>
  </form>

  <div class="links">
    <button class="link" data-url="https://youtube.com">YouTube</button>
    <button class="link" data-url="https://github.com">GitHub</button>
    <button class="link" data-url="https://mail.google.com">Gmail</button>
    <button class="link" data-url="https://x.com">X</button>
    <button class="link" data-url="https://nextjs.org">Next.js</button>
    <button class="link" data-url="https://vercel.com">Vercel</button>
    <button class="link" data-url="https://openai.com">OpenAI</button>
  </div>

  <div id="quote" class="quote"></div>
</main>

<div class="footer">Made by <strong>Road.js</strong> with <span class="heart">♥</span></div>

<script>
const clock = document.getElementById("clock");

function updateClock(){
  clock.textContent = new Date().toLocaleTimeString();
}
updateClock();
setInterval(updateClock,1000);

const quotes = [
  "Code is like humor. When you have to explain it, it's bad.",
  "Road.js was here 👀.",
  "Programs must be written for people to read.",
  "Dark mode saves eyes, trust the process.",
  "When in doubt, console.log it."
];
document.getElementById("quote").textContent =
  quotes[Math.floor(Math.random() * quotes.length)];

function go(value){
  const query = value.trim();
  if(!query) return;

  if(query.toLowerCase() === "road.js"){
    alert("🚀 You found the Road.js easter egg!");
    return;
  }

  // Let the parent Axiom browser handle navigation.
  if(window.parent && window.parent !== window){
    window.parent.postMessage({type:"axiom-navigate", value:query},"*");
  }else{
    const engine = document.getElementById("engine").value;
    location.href = engine + encodeURIComponent(query);
  }
}

document.getElementById("searchForm").addEventListener("submit",e=>{
  e.preventDefault();
  go(document.getElementById("searchInput").value);
});

document.querySelectorAll("[data-url]").forEach(button=>{
  button.addEventListener("click",()=>go(button.dataset.url));
});
</script>
</body>
</html>
