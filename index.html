<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Axiom Browser</title>

<script src="/baremux/index.js"></script>
<script src="/scram/scramjet.all.js"></script>
<script src="/proxy.config.js"></script>

<style>
*{box-sizing:border-box}
html,body,#app{width:100%;height:100%;margin:0}
body{overflow:hidden;background:#09090f;color:#fff;font-family:Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}

.app{height:100%;display:flex;flex-direction:column}
.top{height:58px;display:flex;gap:8px;align-items:center;padding:8px;background:#11111a;border-bottom:1px solid #292939}
button{border:0;border-radius:8px;background:#1b1b28;color:#ddd}
.nav{width:40px;height:40px;font-size:18px}
.nav:hover{background:#29293b;color:#fff}

.address-wrap{display:flex;gap:6px;flex:1}
.address{width:100%;height:40px;padding:0 14px;border:1px solid #303044;border-radius:9px;outline:0;background:#0b0b13;color:#fff}
.address:focus{border-color:#765cff}
.go{width:42px}

.tabs{height:42px;display:flex;gap:5px;align-items:end;padding:4px 8px 0;background:#0d0d14;border-bottom:1px solid #292939;overflow-x:auto}
.tab{height:38px;min-width:150px;max-width:220px;padding:0 8px;display:flex;align-items:center;gap:7px;background:#171721;color:#aaa;border-radius:8px 8px 0 0}
.tab.active{background:#222230;color:#fff}
.tab-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.close{width:25px;height:25px;background:transparent}
.newtab-btn{width:34px;height:34px;margin-bottom:2px}

.content{position:relative;flex:1;min-height:0;background:#09090f}
.frames{position:absolute;inset:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.hidden{display:none!important}

.home{position:absolute;z-index:5;inset:0;display:flex;justify-content:center;align-items:center;text-align:center;background:#09090f}
.home-inner{width:min(700px,90%);margin-top:-50px}
.logo{font-size:52px;font-weight:800;margin-bottom:8px}
.subtitle{color:#888;margin-bottom:25px}
.home-search{width:100%;height:52px;padding:0 18px;border:1px solid #303044;border-radius:12px;background:#11111a;color:#fff;outline:0}
.home-search:focus{border-color:#765cff}
.links{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.links button{padding:10px 14px}
</style>
</head>

<body>
<div id="app" class="app">
  <div class="top">
    <button class="nav" id="back">←</button>
    <button class="nav" id="forward">→</button>
    <button class="nav" id="reload">↻</button>

    <div class="address-wrap">
      <input id="address" class="address" placeholder="Search or enter a URL"
             autocomplete="off" spellcheck="false">
      <button id="go" class="go">↵</button>
    </div>
  </div>

  <div id="tabs" class="tabs"></div>

  <div class="content">
    <div id="home" class="home">
      <div class="home-inner">
        <div class="logo">axiom</div>
        <div class="subtitle">Simple browser. Simple interface.</div>
        <input id="homeSearch" class="home-search"
               placeholder="Search the web or enter a URL"
               autocomplete="off" spellcheck="false">
        <div class="links">
          <button data-url="https://duckduckgo.com/">DuckDuckGo</button>
          <button data-url="https://www.google.com/">Google</button>
          <button data-url="https://www.youtube.com/">YouTube</button>
          <button data-url="https://github.com/">GitHub</button>
        </div>
      </div>
    </div>

    <div id="frames" class="frames"></div>
  </div>
</div>

<script>
(() => {
  // One initialization only.
  const { ScramjetController } = $scramjetLoadController();

  const scramjet = new ScramjetController({
    files: {
      wasm: "/scram/scramjet.wasm.wasm",
      all: "/scram/scramjet.all.js",
      sync: "/scram/scramjet.sync.js"
    }
  });

  const connection = new BareMux.BareMuxConnection("/baremux/worker.js");

  const wispurl =
    localStorage.getItem("proxServer") ||
    "wss://gointospace.app/wisp/";

  connection.setTransport("/epoxy/index.mjs", [{wisp: wispurl}]);

  // Service worker is required by Scramjet.
  navigator.serviceWorker?.register("/sw.js").catch(() => {});

  const tabs = [];
  let activeTab = null;
  let nextId = 1;

  const $ = id => document.getElementById(id);

  function normalizeUrl(value) {
    value = (value || "").trim();

    if (!value) return null;

    // URL such as example.com
    if (/^[a-zA-Z][a-zA-Z\d+.-]*:\/\//.test(value)) {
      return value;
    }

    // localhost:3000, example.com, etc.
    if (/^[\w.-]+(?::\d+)?(?:\/.*)?$/.test(value) && value.includes(".")) {
      return "https://" + value;
    }

    // Otherwise search.
    return "https://duckduckgo.com/?q=" + encodeURIComponent(value);
  }

  function createTab() {
    const frame = scramjet.createFrame();

    const tab = {
      id: nextId++,
      title: "New Tab",
      url: "",
      frame
    };

    frame.addEventListener("urlchange", event => {
      if (!event.url) return;

      tab.url = event.url;

      try {
        tab.title =
          frame.frame.contentWindow?.document?.title ||
          new URL(event.url).hostname ||
          "Axiom";
      } catch {
        try {
          tab.title = new URL(event.url).hostname;
        } catch {
          tab.title = "Axiom";
        }
      }

      renderTabs();

      if (activeTab === tab) {
        $("address").value = tab.url;
        $("home").classList.add("hidden");
      }
    });

    tabs.push(tab);
    $("frames").appendChild(frame.frame);

    return tab;
  }

  function selectTab(tab) {
    activeTab = tab;

    for (const t of tabs) {
      t.frame.frame.classList.toggle("hidden", t !== tab);
    }

    $("home").classList.toggle("hidden", !!tab.url);
    $("address").value = tab.url || "";

    renderTabs();
  }

  function closeTab(tab) {
    const index = tabs.indexOf(tab);
    if (index === -1) return;

    tab.frame.frame.remove();
    tabs.splice(index, 1);

    if (!tabs.length) {
      const newTab = createTab();
      selectTab(newTab);
      return;
    }

    if (activeTab === tab) {
      selectTab(tabs[Math.max(0, index - 1)]);
    } else {
      renderTabs();
    }
  }

  function renderTabs() {
    const container = $("tabs");
    container.innerHTML = "";

    for (const tab of tabs) {
      const el = document.createElement("div");
      el.className = "tab" + (tab === activeTab ? " active" : "");
      el.onclick = () => selectTab(tab);

      const title = document.createElement("span");
      title.className = "tab-title";
      title.textContent = tab.title;

      const close = document.createElement("button");
      close.className = "close";
      close.textContent = "×";
      close.onclick = e => {
        e.stopPropagation();
        closeTab(tab);
      };

      el.append(title, close);
      container.appendChild(el);
    }

    const add = document.createElement("button");
    add.className = "newtab-btn";
    add.textContent = "+";
    add.title = "New tab";
    add.onclick = () => {
      const tab = createTab();
      selectTab(tab);
    };

    container.appendChild(add);
  }

  function navigate(value) {
    if (!activeTab) return;

    const url = normalizeUrl(value);
    if (!url) return;

    activeTab.url = url;
    activeTab.title = "Loading…";

    $("address").value = url;
    $("home").classList.add("hidden");
    renderTabs();

    activeTab.frame.go(url);
  }

  $("go").onclick = () => navigate($("address").value);

  $("address").addEventListener("keydown", e => {
    if (e.key === "Enter") navigate(e.target.value);
  });

  $("homeSearch").addEventListener("keydown", e => {
    if (e.key === "Enter") navigate(e.target.value);
  });

  document.querySelectorAll("[data-url]").forEach(button => {
    button.onclick = () => navigate(button.dataset.url);
  });

  $("back").onclick = () => activeTab?.frame.back();
  $("forward").onclick = () => activeTab?.frame.forward();
  $("reload").onclick = () => activeTab?.frame.reload();

  // Create the first tab.
  selectTab(createTab());
})();
</script>
</body>
</html>
