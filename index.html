<!DOCTYPE html>
<!--
  Hey you! Yeah, you reading this like a curious little nerd.
  This is Road.js' "I kinda know what I'm doing" browser proxy.
  Warning: I hate HTML. I hate static pages. I still made this. Somehow.
  Don't @ me. Just enjoy the chaos. 💀❤️
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axiom Browser</title>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

  <style>
    :root {
      --bg: #05050a;
      --surface: #0a0a12;
      --surface-2: #0e0e18;
      --button-bg: #10101b;
      --button-hover: #17172a;
      --third-bg: #1b1930;
      --primary: #8b6cff;
      --primary-2: #5f4bff;
      --text-color: #f5f3ff;
      --secondary-text-color: #9b96ad;
      --border: rgba(139,108,255,.16);
      --glow: rgba(139,108,255,.20);
    }

    * { box-sizing: border-box; }

    html, body, #app {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% -20%, rgba(139,108,255,.14), transparent 38%),
        var(--bg);
      color: var(--text-color);
      font-family: Inter, Outfit, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 15% 80%, rgba(95,75,255,.07), transparent 28%),
        radial-gradient(circle at 85% 20%, rgba(139,108,255,.06), transparent 25%);
      z-index: 0;
    }

    button, input { font: inherit; }

    .browser-container {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
      color: var(--text-color);
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 45px;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      padding: 0 2px;
    }

    .tabs::-webkit-scrollbar { height: 3px; }
    .tabs::-webkit-scrollbar-track { background: transparent; }
    .tabs::-webkit-scrollbar-thumb {
      background: rgba(139,108,255,.35);
      border-radius: 99px;
    }

    .tab {
      position: relative;
      color: var(--text-color);
      border: 1px solid var(--border);
      border-radius: 11px;
      background: rgba(12,12,20,.86);
      padding: 8px 10px;
      width: 225px;
      min-width: 225px;
      height: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      flex-shrink: 0;
      transition: .18s ease;
      box-shadow: 0 4px 18px rgba(0,0,0,.16);
    }

    .tab:hover {
      background: #12121f;
      border-color: rgba(139,108,255,.30);
      transform: translateY(-1px);
    }

    .tab.active {
      background: linear-gradient(135deg, rgba(139,108,255,.18), rgba(95,75,255,.08));
      border-color: rgba(139,108,255,.48);
      box-shadow: 0 0 22px rgba(139,108,255,.10);
    }

    .tab-favicon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      border-radius: 5px;
    }

    .tab-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: .91rem;
      font-weight: 500;
    }

    .tab-close {
      background: transparent;
      border: 0;
      color: var(--secondary-text-color);
      cursor: pointer;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      flex-shrink: 0;
      transition: .18s ease;
      font-size: 1.15rem;
    }

    .tab-close:hover {
      background: rgba(255,255,255,.07);
      color: white;
    }

    .new-tab {
      color: var(--text-color);
      border: 1px solid var(--border);
      border-radius: 11px;
      background: rgba(12,12,20,.86);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: .18s ease;
      font-size: 1.2rem;
    }

    .new-tab:hover {
      background: var(--button-hover);
      border-color: rgba(139,108,255,.42);
      box-shadow: 0 0 18px var(--glow);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0;
      min-height: 48px;
    }

    .nav button {
      color: var(--text-color);
      outline: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: linear-gradient(180deg, #11111c, #0c0c15);
      width: 43px;
      height: 43px;
      padding: 0;
      cursor: pointer;
      transition: .18s ease;
      font-size: 1.05rem;
    }

    .nav button:hover {
      background: var(--button-hover);
      border-color: rgba(139,108,255,.42);
      box-shadow: 0 0 16px rgba(139,108,255,.10);
    }

    input.bar {
      min-width: 0;
      height: 43px;
      flex: 1;
      padding: 0 16px;
      border: 1px solid var(--border);
      outline: none;
      border-radius: 11px;
      color: var(--text-color);
      background: #0b0b13;
      font-size: .98rem;
      transition: .2s ease;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.01);
    }

    input.bar:focus {
      border-color: rgba(139,108,255,.55);
      background: #0d0d17;
      box-shadow: 0 0 0 3px rgba(139,108,255,.08), 0 0 22px rgba(139,108,255,.08);
    }

    .version {
      color: var(--secondary-text-color) !important;
      font-size: .82rem;
      margin: 0 4px 0 3px;
      white-space: nowrap;
      opacity: .8;
    }

    .version b {
      color: var(--primary);
      letter-spacing: .04em;
    }

    .iframe-container {
      flex: 1;
      min-height: 0;
      position: relative;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 12px 45px rgba(0,0,0,.28), 0 0 35px rgba(139,108,255,.05);
    }

    .iframe-container iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .iframe-container iframe.hidden { display: none; }

    .sortable-ghost { opacity: .45 !important; }
    .sortable-drag {
      transform: rotate(1deg);
      box-shadow: 0 12px 30px rgba(0,0,0,.5), 0 0 25px rgba(139,108,255,.15);
    }

    @media (max-width: 700px) {
      .browser-container { padding: 8px; gap: 7px; }
      .tab { width: 180px; min-width: 180px; }
      .version { display: none; }
      .nav button { width: 39px; height: 39px; }
      input.bar { height: 39px; font-size: .9rem; }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/dreamland"></script>
  <script src="/baremux/index.js"></script>
  <script src="/scram/scramjet.all.js"></script>
  <script src="/proxy.config.js"></script>
</head>
<body>
  <div id="app"></div>

  <script>
    const { ScramjetController } = $scramjetLoadController();
    
    const scramjet = new ScramjetController({
      files: {
        wasm: "/scram/scramjet.wasm.wasm",
        all: "/scram/scramjet.all.js",
        sync: "/scram/scramjet.sync.js",
      },
    });
    
    scramjet.init();
    navigator.serviceWorker.register("./sw.js");

    const connection = new BareMux.BareMuxConnection("/baremux/worker.js");

    const store = {
      url: "https://",
      wispurl: localStorage.getItem("proxServer") || "wss://gointospace.app/wisp/",
      bareurl: _CONFIG?.bareurl || (location.protocol === "https:" ? "https" : "http") + "://" + location.host + "/bare/",
      proxy: "",
    };

    connection.setTransport("/epoxy/index.mjs", [{ wisp: store.wispurl }]);

    // tab management
    let tabs = [];
    let activeTabId = 1;
    let nextTabId = 2;
    let sortableInstance = null;

    function getFaviconUrl(url) {
      try {
        const domain = new URL(url).origin;
        return `https://t0.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=${encodeURIComponent(domain)}`;
      } catch {
        return `https://t0.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=${encodeURIComponent(url)}`;
      }
    }

    function createTab() {
      const frame = scramjet.createFrame();
      const tab = {
        id: nextTabId++,
        title: "New Tab",
        url: "https://start.duckduckgo.com/",
        frame: frame,
        favicon: getFaviconUrl("https://start.duckduckgo.com"),
      };

      frame.frame.src = "/page/newtab.html";

      frame.addEventListener("urlchange", (e) => {
        if (!e.url) return;
        tab.url = e.url;
        tab.favicon = getFaviconUrl(e.url);

        try {
          const title = frame.frame.contentWindow?.document?.title || new URL(e.url).hostname;
          tab.title = title || "...";
        } catch (err) {
          tab.title = new URL(e.url).hostname || "...";
        }

        updateTabsUI();
        updateAddressBar();
      });

      tabs.push(tab);
      return tab;
    }

    function getActiveTab() {
      return tabs.find((tab) => tab.id === activeTabId);
    }

    function switchTab(tabId) {
      tabs.forEach((tab) => {
        tab.frame.frame.classList.add("hidden");
      });

      activeTabId = tabId;
      const activeTab = getActiveTab();
      if (activeTab) {
        activeTab.frame.frame.classList.remove("hidden");
      }

      updateTabsUI();
      updateAddressBar();
    }

    function closeTab(tabId) {
      const tabIndex = tabs.findIndex((tab) => tab.id === tabId);
      if (tabIndex === -1) return;

      const tab = tabs[tabIndex];

      if (tabs.length === 1) {
        const newTab = createTab();
        document.getElementById("iframe-container").appendChild(newTab.frame.frame);
        switchTab(newTab.id);
      }

      if (tab.frame.frame.parentNode) {
        tab.frame.frame.parentNode.removeChild(tab.frame.frame);
      }

      tabs.splice(tabIndex, 1);

      if (activeTabId === tabId && tabs.length > 0) {
        const newActiveIndex = Math.min(tabIndex, tabs.length - 1);
        activeTabId = tabs[newActiveIndex].id;
        switchTab(activeTabId);
      } else {
        updateTabsUI();
      }
    }

    function updateTabsUI() {
      const tabsContainer = document.getElementById("tabs-container");
      if (!tabsContainer) return;

      tabsContainer.innerHTML = "";

      tabs.forEach((tab) => {
        const tabElement = document.createElement("div");
        tabElement.className = `tab ${tab.id === activeTabId ? "active" : ""}`;
        tabElement.setAttribute("data-tab-id", tab.id);
        tabElement.onclick = () => switchTab(tab.id);

        const faviconImg = document.createElement("img");
        faviconImg.className = "tab-favicon";
        faviconImg.src = tab.favicon;
        faviconImg.alt = "";
        faviconImg.onerror = () => {
          faviconImg.style.display = "none";
        };

        const titleSpan = document.createElement("span");
        titleSpan.className = "tab-title";
        titleSpan.textContent = tab.title;

        const closeButton = document.createElement("button");
        closeButton.className = "tab-close";
        closeButton.textContent = "×";
        closeButton.onclick = (e) => {
          e.stopPropagation();
          closeTab(tab.id);
        };

        tabElement.appendChild(faviconImg);
        tabElement.appendChild(titleSpan);
        tabElement.appendChild(closeButton);
        tabsContainer.appendChild(tabElement);
      });

      const newTabButton = document.createElement("button");
      newTabButton.className = "new-tab";
      newTabButton.textContent = "+";
      newTabButton.onclick = () => {
        const newTab = createTab();
        document.getElementById("iframe-container").appendChild(newTab.frame.frame);
        switchTab(newTab.id);
      };
      tabsContainer.appendChild(newTabButton);

      if (sortableInstance) {
        sortableInstance.destroy();
      }

      sortableInstance = new Sortable(tabsContainer, {
        animation: 200,
        direction: "horizontal",
        ghostClass: "sortable-ghost",
        dragClass: "sortable-drag",
        filter: ".new-tab",
        onStart: () => {
          tabsContainer.querySelectorAll(".tab:not(.sortable-ghost)").forEach((t) => {
            t.style.opacity = "0.5";
          });
        },
        onEnd: (evt) => {
          tabsContainer.querySelectorAll(".tab").forEach((t) => {
            t.style.opacity = "1";
          });
          if (evt.oldIndex !== evt.newIndex) {
            const movedTab = tabs.splice(evt.oldIndex, 1)[0];
            tabs.splice(evt.newIndex, 0, movedTab);
          }
        },
      });
    }

    function updateAddressBar() {
      const addressBar = document.getElementById("address-bar");
      const activeTab = getActiveTab();
      if (addressBar && activeTab) {
        addressBar.value = activeTab.url;
      }
    }

    function handleSubmit() {
      const activeTab = getActiveTab();
      const addressBar = document.getElementById("address-bar");
      if (!activeTab || !addressBar) return;

      let url = addressBar.value.trim();
      if (!url.startsWith("http") && !url.includes(".")) {
        url = "https://duckduckgo.com/?q=" + encodeURIComponent(url);
      } else if (!url.startsWith("http")) {
        url = "https://" + url;
      }

      activeTab.url = url;
      activeTab.favicon = getFaviconUrl(url);
      return activeTab.frame.go(url);
    }

    window.addEventListener("load", async () => {
      const root = document.getElementById("app");
      root.innerHTML = `
        <div class="browser-container">
          <div style="position:absolute;left:14px;top:2px;font-weight:800;font-size:.68rem;letter-spacing:.16em;color:#8b6cff;opacity:.8;pointer-events:none;z-index:5;">AXIOM</div>
          <div class="flex tabs" id="tabs-container"></div>
          <div class="flex nav">
            <button onclick="getActiveTab()?.frame.back()">←</button>
            <button onclick="getActiveTab()?.frame.forward()">→</button>
            <button onclick="getActiveTab()?.frame.reload()">↻</button>
            <input class="bar" id="address-bar" autocomplete="off" autocapitalize="off" autocorrect="off" 
              onkeyup="event.keyCode === 13 && handleSubmit()">
            <button onclick="window.open(scramjet.encodeUrl(getActiveTab()?.url))">↗</button>
            <p class="version"><b></b></p>
          </div>
          <div class="iframe-container" id="iframe-container"></div>
        </div>
      `;

      const initialTab = createTab();
      document.getElementById("iframe-container").appendChild(initialTab.frame.frame);
      switchTab(initialTab.id);
      updateTabsUI();
    });
  </script>
</body>
</html>
